<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>테슬라 로그인 인증 코드</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #171A20;
    color: #F5F5F5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    text-align: center;
    box-sizing: border-box;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  p.desc { font-size: 13px; opacity: 0.7; margin-top: 0; margin-bottom: 24px; }
  .box {
    background: #22262E;
    border-radius: 12px;
    padding: 18px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 14px;
  }
  .label { font-size: 12px; opacity: 0.6; margin-bottom: 6px; text-align: left; }
  .value {
    font-family: monospace;
    font-size: 14px;
    word-break: break-all;
    text-align: left;
    background: #171A20;
    padding: 10px;
    border-radius: 8px;
  }
  button {
    margin-top: 10px;
    background: #1E88E5;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  button:active { opacity: 0.8; }
  .empty { opacity: 0.5; font-size: 13px; margin-top: 30px; }
</style>
</head>
<body>
  <h1>테슬라 로그인 인증 코드</h1>
  <p class="desc">아래 code 값을 복사해서 앱(또는 토큰 교환할 때)에 붙여넣으세요.</p>
  <div id="result"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");
    const container = document.getElementById("result");

    function makeBox(label, value) {
      const box = document.createElement("div");
      box.className = "box";
      const l = document.createElement("div");
      l.className = "label";
      l.textContent = label;
      const v = document.createElement("div");
      v.className = "value";
      v.textContent = value;
      const btn = document.createElement("button");
      btn.textContent = "복사하기";
      btn.onclick = () => {
        navigator.clipboard.writeText(value).then(() => {
          btn.textContent = "복사됨!";
          setTimeout(() => (btn.textContent = "복사하기"), 1500);
        });
      };
      box.appendChild(l);
      box.appendChild(v);
      box.appendChild(btn);
      return box;
    }

    if (code) {
      container.appendChild(makeBox("code", code));
      if (state) container.appendChild(makeBox("state", state));
    } else if (error) {
      container.appendChild(makeBox("error", error));
    } else {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "전달된 인증 코드가 없습니다. 테슬라 로그인 인증을 다시 시도해보세요.";
      container.appendChild(empty);
    }
  </script>
</body>
</html>
